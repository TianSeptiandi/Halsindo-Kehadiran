<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Halsindo</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Boxicons -->
  <link
    href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />

  <style>

    body {

      overflow-x: hidden;
      background: #f1f1f1;

    }

    .side-navbar {

      width: 250px;
      height: 100vh;
      position: fixed;
      background: #004d4d;
      transition: 0.5s;

    }

    .my-container {

      margin-left: 250px;
      transition: 0.4s;

    }

    .active-nav {

      margin-left: -250px;

    }

    .active-cont {

      margin-left: 0;

    }

    #menu-btn {

      background: #000;
      color: white;

    }

    #clock {

      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;

    }

  </style>

</head>

<body>

<!-- SIDEBAR -->
<div
class="side-navbar d-flex justify-content-between flex-wrap flex-column"
id="sidebar">

  <ul class="nav flex-column text-white w-100">

    <a href="#" class="nav-link text-white my-3">

      <p class="fs-3 fw-bold text-warning">
        PT Halsindo
      </p>

      <div id="clock"></div>

    </a>

    <li class="nav-item">

      <a href="Kehadiran.html" class="nav-link">

        <i class="bi bi-file-earmark-text text-white"></i>

        <span class="mx-2 text-white fs-4">
          Kehadiran
        </span>

      </a>

    </li>

  </ul>

  <div>

    <p class="text-white text-center p-3">

      “Awali Hari dengan Tepat Waktu dan Semangat”

    </p>

    <!-- LOGOUT -->
    <div class="text-center mb-4">

      <button
      id="logout"
      class="btn btn-warning">

      Logout

      </button>

    </div>

  </div>

</div>

<!-- MAIN -->
<div class="p-1 my-container" id="container">

  <!-- TOP NAV -->
  <nav class="navbar navbar-light bg-light px-4">

    <button class="btn" id="menu-btn">

      <i class="bx bx-menu"></i>

    </button>

    <h3 class="text-warning fw-bold">

      Monitoring Kehadiran

    </h3>

  </nav>

  <!-- CONTENT -->
  <h1 class="p-3">

    DASHBOARD

  </h1>

  <div class="px-3">

    <img src="Halsindo.jpg"
alt="Foto Dashboard"
class="dashboard-img">

  </div>

</div>

<!-- JAM -->
<script>

setInterval(() => {

  let date = new Date();

  let jam = document.getElementById("clock");

  jam.innerHTML =

  date.getHours() + ":" +
  date.getMinutes() + ":" +
  date.getSeconds();

}, 1000);

</script>

<!-- MENU -->
<script>

var menu_btn = document.querySelector("#menu-btn");

var sidebar = document.querySelector("#sidebar");

var container = document.querySelector("#container");

menu_btn.addEventListener("click", () => {

  sidebar.classList.toggle("active-nav");

  container.classList.toggle("active-cont");

});

</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getAuth,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

// FIREBASE CONFIG
const firebaseConfig = {

  apiKey: "AIzaSyBH9fdaDioSIBohv04Nwn5UsB-Wh8Q8AaU",

  authDomain: "latihan2-ba4c5.firebaseapp.com",

  projectId: "latihan2-ba4c5",

  storageBucket: "latihan2-ba4c5.firebasestorage.app",

  messagingSenderId: "515994512533",

  appId: "1:515994512533:web:7bdd166157ac92f398ff9c"

};

// FIREBASE
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

// CEK LOGIN
onAuthStateChanged(auth, (user) => {

  if (!user) {

    window.location.href = "login.html";

  }

});

// LOGOUT
document.getElementById("logout")
.addEventListener("click", () => {

  signOut(auth)

  .then(() => {

    alert("Logout berhasil");

    window.location.href = "login.html";

  });

});

</script>

</body>
</html>
