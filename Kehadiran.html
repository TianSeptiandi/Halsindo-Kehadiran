<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kehadiran PT Nozomi</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body style="background:#f1f1f1;">

<!-- JUDUL -->
<h2 class="text-center p-3">

  Form Kehadiran PT Nozomi Otomotif Indonesia

</h2>

<!-- CONTAINER -->
<div class="container bg-white p-4 rounded shadow mb-5">

  <!-- FOTO -->
  <img
  src="Halsindo.jpg"
  class="img-fluid rounded w-100 mb-4"
  style="height:300px; object-fit:cover;">

  <!-- FORM -->
  <table class="table">

    <!-- TANGGAL -->
    <tr>

      <td><b>Tanggal</b></td>

      <td>

        <input
        type="date"
        id="tanggal"
        class="form-control">

      </td>

    </tr>

    <!-- NAMA -->
    <tr>

      <td><b>Nama</b></td>

      <td>

        <select id="nama" class="form-control">

          <option value="">
            Pilih Nama Karyawan
          </option>

          <option>MUHAMAD NUR IKHSAN</option>
          <option>HARY HARYANTO</option>
          <option>ABDUL HALIM</option>
          <option>MELAN MULYANA</option>
          <option>RIFKI DAFA SULTONI</option>
          <option>FARHAN RAMDHANI</option>
          <option>TRI SUTRIO</option>
          <option>RUDI</option>
          <option>TIAN SEPTIANDI</option>
          <option>AHMAD FAUZI</option>
          <option>CECEP PIRMAN</option>

        </select>

      </td>

    </tr>

    <!-- STATUS -->
    <tr>

      <td><b>Status</b></td>

      <td>

        <select id="status" class="form-control">

          <option>Hadir</option>
          <option>Izin</option>
          <option>Sakit</option>
          <option>Alpha</option>

        </select>

      </td>

    </tr>

    <!-- OVERTIME -->
    <tr>

      <td><b>Overtime</b></td>

      <td>

        <select id="overtime" class="form-control">

          <option>Tidak</option>
          <option>Ya</option>

        </select>

      </td>

    </tr>

    <!-- LOKASI -->
    <tr>

      <td><b>Lokasi GPS</b></td>

      <td>

        <input
        type="text"
        id="lokasi"
        class="form-control"
        readonly>

        <button
        type="button"
        onclick="ambilLokasi()"
        class="btn btn-success mt-2">

        Ambil Lokasi

        </button>

      </td>

    </tr>

  </table>

  <!-- SIMPAN -->
  <button
  id="simpan"
  class="btn btn-primary">

  Simpan Kehadiran

  </button>

  <hr>

  <!-- DATA -->
  <ul id="daftar"></ul>

</div>

<!-- SCRIPT GPS -->
<script>

function ambilLokasi() {

  if (navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(

      function(posisi) {

        let latitude = posisi.coords.latitude;

        let longitude = posisi.coords.longitude;

        // LINK GOOGLE MAPS
        let maps =

        "https://www.google.com/maps?q="
        + latitude + "," + longitude;

        // tampilkan ke input
        document.getElementById("lokasi").value = maps;

        alert("Lokasi berhasil diambil");

      },

      function(error) {

        alert("Lokasi gagal diambil");

      }

    );

  } else {

    alert("Browser tidak mendukung GPS");

  }

}

</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  remove
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const app = initializeApp({

  apiKey: "AIzaSyBH9fdaDioSIBohv04Nwn5UsB-Wh8Q8AaU",

  authDomain: "latihan2-ba4c5.firebaseapp.com",

  projectId: "latihan2-ba4c5",

  storageBucket: "latihan2-ba4c5.firebasestorage.app",

  messagingSenderId: "515994512533",

  appId: "1:515994512533:web:7bdd166157ac92f398ff9c"

});

const db = getDatabase(app);

const tanggal = document.getElementById("tanggal");
const nama = document.getElementById("nama");
const status = document.getElementById("status");
const overtime = document.getElementById("overtime");
const lokasi = document.getElementById("lokasi");

const simpan = document.getElementById("simpan");

const daftar = document.getElementById("daftar");

const dataRef = ref(db, "Kehadiran");

// SIMPAN
simpan.onclick = () => {

  if (
    !tanggal.value ||
    !nama.value ||
    !lokasi.value
  ) {

    alert("Lengkapi data");

    return;
  }

  push(dataRef, {

    tanggal: tanggal.value,
    nama: nama.value,
    status: status.value,
    overtime: overtime.value,
    lokasi: lokasi.value

  });

  alert("Kehadiran berhasil disimpan");

  tanggal.value = "";
  nama.value = "";
  status.value = "Hadir";
  overtime.value = "Tidak";
  lokasi.value = "";

};

// TAMPIL DATA
onValue(dataRef, (snap) => {

  daftar.innerHTML = "";

  snap.forEach((item) => {

    const data = item.val();

    const key = item.key;

    daftar.innerHTML += `

    <li style="
    margin-bottom:20px;
    background:white;
    padding:15px;
    border-radius:10px;
    list-style:none;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
    ">

    <b>Tanggal :</b> ${data.tanggal}<br>

    <b>Nama :</b> ${data.nama}<br>

    <b>Status :</b> ${data.status}<br>

    <b>Overtime :</b> ${data.overtime}<br>

    <b>Lokasi :</b>

    <a href="${data.lokasi}"
    target="_blank">

    Lihat Maps

    </a>

    <br><br>

    <button
    onclick="hapusData('${key}')"
    class="btn btn-danger btn-sm">

    Hapus

    </button>

    </li>

    `;

  });

});

// HAPUS
window.hapusData = function(key) {

  let yakin = confirm(
    "Yakin mau hapus data ini?"
  );

  if (yakin) {

    remove(ref(db, "Kehadiran/" + key));

  }

}

</script>

</body>
</html>
