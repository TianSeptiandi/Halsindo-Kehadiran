<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kehadiran PT Halsindo</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background:#f1f1f1;
overflow-x:hidden;

}

.container{

max-width:900px;
padding:10px;

}

.card{

width:100%;
border-radius:12px;

}

img{

max-width:100%;
height:auto;

}

/* HP */
@media(max-width:768px){

h2{

font-size:20px;

}

.card{

font-size:13px;

}

button{

font-size:12px;

}

img{

width:100% !important;
height:auto !important;

}

}

/* LAPTOP */
@media(min-width:769px){

.container{

max-width:900px;

}

}

</style>

</head>

<body>

<div class="container mt-4 mb-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">

Kehadiran PT Halsindo

</h2>

<!-- TANGGAL -->
<div class="mb-3">

<label>Tanggal</label>

<input
type="date"
id="tanggal"
class="form-control">

</div>

<!-- JAM -->
<div class="mb-3">

<label>Jam Otomatis</label>

<input
type="text"
id="jam"
readonly
class="form-control">

</div>

<!-- NAMA -->
<div class="mb-3">

<label>Nama</label>

<select
id="nama"
class="form-control">

<option value="">
Pilih Nama
</option>

<option>Tian Septiandi</option>
<option>Rudi</option>
<option>Farhan Ramdhani</option>
<option>Cecep Pirman</option>
<option>Melan Mulyana</option>
<option>Abdul Halim</option>
<option>Tri Sutrio</option>
<option>Ahmad Fauzi</option>

</select>

</div>

<!-- STATUS -->
<div class="mb-3">

<label>Status</label>

<select
id="status"
class="form-control">

<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
<option>Alpha</option>

</select>

</div>

<!-- LEMBUR -->
<div class="mb-3">

<label>Lembur</label>

<select
id="lembur"
class="form-control">

<option>Tidak</option>
<option>Ya</option>

</select>

</div>

<!-- FOTO -->
<div class="mb-3">

<label>Foto Selfie</label>

<input
type="file"
id="foto"
accept="image/*"
capture="user"
class="form-control">

</div>

<!-- LOKASI -->
<div class="mb-3">

<label>Lokasi GPS</label>

<input
type="text"
id="lokasi"
readonly
class="form-control">

<button
type="button"
onclick="ambilLokasi()"
class="btn btn-success mt-2">

Ambil Lokasi

</button>

</div>

<!-- BUTTON -->
<button
id="simpan"
class="btn btn-primary w-100">

Simpan Kehadiran

</button>

<p
id="mode"
class="text-danger mt-2">

</p>

<hr>

<div id="daftar"></div>

</div>

</div>

<script type="module" src="Kehadiran.js"></script>

</body>
</html>
