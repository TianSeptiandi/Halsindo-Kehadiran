<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Absensi PT Halsindo</title>

  <!-- BOOTSTRAP -->
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
  rel="stylesheet">

</head>

<body style="background:#f1f1f1;">

<!-- JUDUL -->
<h2 class="text-center p-3">

  Sistem Kehadiran
  PT Halsindo

</h2>

<!-- CONTAINER -->
<div class="container bg-white p-4 rounded shadow mb-5">

  <!-- FOTO -->
  <img
  src="Halsindo.jpg"
  class="img-fluid rounded w-100 mb-4"
  style="height:300px; object-fit:cover;">

  <!-- FORM -->
  <table class="table">

    <!-- TANGGAL -->
    <tr>

      <td width="200">
        <b>Tanggal</b>
      </td>

      <td>

        <input
        type="date"
        id="tanggal"
        class="form-control">

      </td>

    </tr>

    <!-- JAM -->
    <tr>

      <td>
        <b>Jam</b>
      </td>

      <td>

        <input
        type="text"
        id="jam"
        class="form-control"
        readonly>

      </td>

    </tr>

    <!-- NAMA -->
    <tr>

      <td>
        <b>Nama</b>
      </td>

      <td>

        <select
        id="nama"
        class="form-control">

          <option value="">
            Pilih Nama Karyawan
          </option>

          <option>MUHAMAD NUR IKHSAN</option>
          <option>HARY HARYANTO</option>
          <option>ABDUL HALIM</option>
          <option>MELAN MULYANA</option>
          <option>RIFKI DAFA SULTONI</option>
          <option>FARHAN RAMDHANI</option>
          <option>TRI SUTRIO</option>
          <option>RUDI</option>
          <option>TIAN SEPTIANDI</option>
          <option>AHMAD FAUZI</option>
          <option>CECEP PIRMAN</option>

        </select>

      </td>

    </tr>

    <!-- STATUS -->
    <tr>

      <td>
        <b>Status</b>
      </td>

      <td>

        <select
        id="status"
        class="form-control">

          <option>Hadir</option>
          <option>Izin</option>
          <option>Sakit</option>
          <option>Alpha</option>

        </select>

      </td>

    </tr>

    <!-- OVERTIME -->
    <tr>

      <td>
        <b>Overtime</b>
      </td>

      <td>

        <select
        id="overtime"
        class="form-control">

          <option>Tidak</option>
          <option>Ya</option>

        </select>

      </td>

    </tr>

    <!-- SELFIE -->
    <tr>

      <td>
        <b>Selfie Realtime</b>
      </td>

      <td>

        <input
        type="file"
        id="foto"
        accept="image/*"
        capture="user"
        class="form-control">

      </td>

    </tr>

    <!-- LOKASI -->
    <tr>

      <td>
        <b>Lokasi GPS</b>
      </td>

      <td>

        <input
        type="text"
        id="lokasi"
        class="form-control"
        readonly>

        <button
        type="button"
        onclick="ambilLokasi()"
        class="btn btn-success mt-2">

        Ambil Lokasi

        </button>

      </td>

    </tr>

  </table>

  <!-- BUTTON -->
  <button
  id="simpan"
  class="btn btn-primary">

  Simpan Kehadiran

  </button>

  <p
  id="mode"
  class="text-danger mt-2">
  </p>

  <hr>

  <!-- DATA -->
  <div id="daftar"></div>

</div>

<!-- SCRIPT JAM -->
<script>

setInterval(() => {

  let now = new Date();

  let jam =

  now.getHours()
  .toString()
  .padStart(2,"0")

  + ":" +

  now.getMinutes()
  .toString()
  .padStart(2,"0")

  + ":" +

  now.getSeconds()
  .toString()
  .padStart(2,"0");

  document
  .getElementById("jam")
  .value = jam;

}, 1000);

</script>

<!-- SCRIPT GPS -->
<script>

function ambilLokasi() {

  if (!navigator.geolocation) {

    alert(
    "Browser tidak mendukung GPS"
    );

    return;

  }

  navigator.geolocation.getCurrentPosition(

    function(posisi) {

      const latitude =
      posisi.coords.latitude;

      const longitude =
      posisi.coords.longitude;

      const maps =

      "https://www.google.com/maps?q="
      + latitude + "," + longitude;

      document
      .getElementById("lokasi")
      .value = maps;

      alert(
      "Lokasi berhasil diambil"
      );

    },

    function(error) {

      alert(
      "Lokasi gagal diambil\n\n"
      + error.message
      );

    }

  );

}

</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {

getDatabase,
ref,
push,
onValue,
remove,
update

}

from
"https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

import {

getStorage,
ref as storageRef,
uploadBytes,
getDownloadURL

}

from
"https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

// FIREBASE CONFIG
const app = initializeApp({

apiKey:
"AIzaSyBH9fdaDioSIBohv04Nwn5UsB-Wh8Q8AaU",

authDomain:
"latihan2-ba4c5.firebaseapp.com",

projectId:
"latihan2-ba4c5",

storageBucket:
"latihan2-ba4c5.firebasestorage.app",

messagingSenderId:
"515994512533",

appId:
"1:515994512533:web:7bdd166157ac92f398ff9c"

});

const db =
getDatabase(app);

const storage =
getStorage(app);

// ELEMEN
const tanggal =
document.getElementById("tanggal");

const jam =
document.getElementById("jam");

const nama =
document.getElementById("nama");

const status =
document.getElementById("status");

const overtime =
document.getElementById("overtime");

const lokasi =
document.getElementById("lokasi");

const foto =
document.getElementById("foto");

const simpan =
document.getElementById("simpan");

const daftar =
document.getElementById("daftar");

const mode =
document.getElementById("mode");

const dataRef =
ref(db, "Kehadiran");

// MODE EDIT
let editKey = null;

// SIMPAN
simpan.onclick = async () => {

  if (

    !tanggal.value ||
    !nama.value ||
    !lokasi.value ||
    !foto.files[0]

  ) {

    alert(
    "Lengkapi semua data"
    );

    return;

  }

  // upload selfie
  let file = foto.files[0];

  let simpanFoto =

  storageRef(
  storage,
  "selfie/" + Date.now()
  );

  await uploadBytes(
  simpanFoto,
  file
  );

  let fotoURL =

  await getDownloadURL(
  simpanFoto
  );

  // TAMBAH DATA
  if (editKey == null) {

    push(dataRef, {

      tanggal:
      tanggal.value,

      jam:
      jam.value,

      nama:
      nama.value,

      status:
      status.value,

      overtime:
      overtime.value,

      lokasi:
      lokasi.value,

      foto:
      fotoURL

    });

    alert(
    "Kehadiran berhasil disimpan"
    );

  }

  // UPDATE DATA
  else {

    update(

      ref(
      db,
      "Kehadiran/" + editKey
      ),

      {

      tanggal:
      tanggal.value,

      jam:
      jam.value,

      nama:
      nama.value,

      status:
      status.value,

      overtime:
      overtime.value,

      lokasi:
      lokasi.value,

      foto:
      fotoURL

      }

    );

    alert(
    "Data berhasil diupdate"
    );

    editKey = null;

    mode.innerHTML = "";

    simpan.innerHTML =
    "Simpan Kehadiran";

  }

  // RESET
  tanggal.value = "";

  nama.value = "";

  status.value =
  "Hadir";

  overtime.value =
  "Tidak";

  lokasi.value = "";

  foto.value = "";

};

// TAMPIL DATA
onValue(dataRef, (snap) => {

  daftar.innerHTML = "";

  let grupTanggal = {};

  snap.forEach((item) => {

    let data = item.val();

    let key = item.key;

    if (!grupTanggal[data.tanggal]) {

      grupTanggal[data.tanggal]
      = [];

    }

    grupTanggal[data.tanggal]
    .push({

      key:key,

      tanggal:data.tanggal,

      jam:data.jam,

      nama:data.nama,

      status:data.status,

      overtime:data.overtime,

      lokasi:data.lokasi,

      foto:data.foto

    });

  });

  // tampil
  for (let tanggal in grupTanggal) {

    daftar.innerHTML += `

    <div style="
    background:white;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
    ">

    <h4>

    📅 ${tanggal}

    </h4>

    `;

    grupTanggal[tanggal]
    .forEach((item,index) => {

      daftar.innerHTML += `

      <div style="
      border-bottom:1px solid #ddd;
      padding:10px;
      margin-bottom:10px;
      ">

      <b>

      ${index + 1}.
      ${item.nama}

      </b>

      <br>

      🕒 Jam :
      ${item.jam}

      <br>

      📌 Status :
      ${item.status}

      <br>

      ⏰ Overtime :
      ${item.overtime}

      <br><br>

      <a
      href="${item.lokasi}"
      target="_blank">

      📍 Lihat Lokasi

      </a>

      <br><br>

      <img
      src="${item.foto}"
      width="120"
      class="rounded">

      <br><br>

      <button
      onclick="editData(
      '${item.key}',
      '${item.tanggal}',
      '${item.nama}',
      '${item.status}',
      '${item.overtime}',
      '${item.lokasi}'
      )"
      class="btn btn-warning btn-sm">

      Update

      </button>

      <button
      onclick="hapusData(
      '${item.key}'
      )"
      class="btn btn-danger btn-sm">

      Hapus

      </button>

      </div>

      `;

    });

    daftar.innerHTML += `</div>`;

  }

});

// HAPUS
window.hapusData =
function(key) {

  let yakin = confirm(
  "Yakin mau hapus data?"
  );

  if (yakin) {

    remove(
    ref(db,
    "Kehadiran/" + key)
    );

  }

}

// EDIT
window.editData =
function(

key,
tanggalData,
namaData,
statusData,
overtimeData,
lokasiData

) {

  tanggal.value =
  tanggalData;

  nama.value =
  namaData;

  status.value =
  statusData;

  overtime.value =
  overtimeData;

  lokasi.value =
  lokasiData;

  editKey = key;

  mode.innerHTML =
  "Mode Update";

  simpan.innerHTML =
  "Update Data";

}

</script>

</body>
</html>
